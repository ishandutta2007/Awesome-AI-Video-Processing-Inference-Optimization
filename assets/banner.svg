<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a18" />
      <stop offset="50%" stop-color="#0e112a" />
      <stop offset="100%" stop-color="#05060f" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <radialGradient id="orbGlow1" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="pillGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.45; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-30px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cardShimmer {
      0%, 100% { opacity: 0.85; transform: translateY(0px); }
      50% { opacity: 1; transform: translateY(-4px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .dash-line { stroke-dasharray: 8, 8; animation: flowLine 15s linear infinite; }
    .floating-pill { animation: cardShimmer 4s ease-in-out infinite; }
    .pill-2 { animation-delay: 1.5s; }
    .pill-3 { animation-delay: 3s; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Orbs (Background) -->
  <circle cx="200" cy="120" r="240" fill="url(#orbGlow1)" filter="url(#blurFilter)" class="orb-1" />
  <circle cx="980" cy="300" r="260" fill="url(#orbGlow2)" filter="url(#blurFilter)" class="orb-2" />

  <!-- Background Cyber Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Flow Curves (Background Dynamic Accents) -->
  <path d="M-50,320 Q 300,180 600,290 T 1250,150" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.25" class="dash-line" />
  <path d="M-50,380 Q 400,240 800,340 T 1250,220" fill="none" stroke="url(#accentCyan)" stroke-width="1.5" opacity="0.2" class="dash-line" style="animation-direction: reverse;" />

  <!-- Dynamic Floating Accent Dots -->
  <circle cx="180" cy="290" r="3" fill="#6366f1" class="particle-1" />
  <circle cx="880" cy="120" r="4" fill="#a855f7" class="particle-2" />
  <circle cx="1060" cy="220" r="3.5" fill="#ec4899" class="particle-3" />
  <circle cx="340" cy="90" r="2.5" fill="#06b6d4" class="particle-2" />

  <!-- Sub-Header Pill Tag -->
  <g transform="translate(600, 70)">
    <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9" />
    <text text-anchor="middle" y="5" fill="#a5b4fc" class="sub-text" font-size="13" letter-spacing="2">⚡ CURATED VIDEO AI &amp; RUNTIMES</text>
  </g>

  <!-- Foreground Title and Subtitle (Crisp and Unobscured) -->
  <g transform="translate(600, 155)">
    <text text-anchor="middle" y="0" fill="url(#neonGlow)" class="title-text" font-size="44" letter-spacing="-0.5">
      Awesome AI Video Processing
    </text>
    <text text-anchor="middle" y="52" fill="#ffffff" class="title-text" font-size="34" letter-spacing="-0.5">
      &amp; Inference Optimization 🚀
    </text>
  </g>

  <g transform="translate(600, 255)">
    <text text-anchor="middle" y="0" fill="#94a3b8" class="sub-text" font-size="16" letter-spacing="0.2">
      Foundation Video Models • Local Runtimes • Attention Kernels • Avatars • Multimodal Search
    </text>
  </g>

  <!-- Dynamic Feature Badges / Highlights (Lower Foreground) -->
  <g transform="translate(180, 310)" class="floating-pill">
    <rect width="180" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
    <circle cx="22" cy="21" r="5" fill="#10b981" />
    <text x="38" y="26" fill="#e2e8f0" class="sub-text" font-size="13" font-weight="600">ComfyUI &amp; Diffusers</text>
  </g>

  <g transform="translate(390, 310)" class="floating-pill pill-2">
    <rect width="210" height="42" rx="10" fill="#111827" stroke="#6366f1" stroke-width="1.2" filter="url(#pillGlow)" />
    <circle cx="22" cy="21" r="5" fill="#818cf8" />
    <text x="38" y="26" fill="#e2e8f0" class="sub-text" font-size="13" font-weight="600">SageAttention &amp; TeaCache</text>
  </g>

  <g transform="translate(630, 310)" class="floating-pill pill-3">
    <rect width="190" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
    <circle cx="22" cy="21" r="5" fill="#ec4899" />
    <text x="38" y="26" fill="#e2e8f0" class="sub-text" font-size="13" font-weight="600">Wan 2.1 • CogVideoX</text>
  </g>

  <g transform="translate(850, 310)" class="floating-pill">
    <rect width="170" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
    <circle cx="22" cy="21" r="5" fill="#06b6d4" />
    <text x="38" y="26" fill="#e2e8f0" class="sub-text" font-size="13" font-weight="600">vLLM-Omni &amp; FreeVideo</text>
  </g>

  <!-- Outer Border Stroke -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#312e81" stroke-width="1.5" opacity="0.6" />
</svg>
